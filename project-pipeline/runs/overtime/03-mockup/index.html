<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, initial-scale=1">
<title>Overtime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lav-50: #f7f5fe; --lav-100: #eeeafb; --lav-200: #e4defa; --lav-300: #cfc6f5; --lav-500: #5f50ad;
    --violet: #2b2160; --violet-2: #3a2d80; --ink: #1e1a33; --slate: #4a4470; --line: #ece8f8;
    --mustard: #e5b53a; --mustard-50: #fbf1d3; --mustard-ink: #3d2a02;
    --green-bg: #e3f4ea; --green-ink: #1d5c37; --red-bg: #fde8ee; --red-ink: #9b1c3d; --grey-bg: #eeeeee; --grey-ink: #4d4d4d;
    --radius: 20px;
    --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Figtree', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #fff; color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--font-display); color: var(--violet); margin: 0; line-height: 1.15; letter-spacing: -0.01em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app { display: grid; grid-template-columns: 264px 1fr; width: 1440px; height: 900px; overflow: hidden; }

  /* ---------- Rail ---------- */
  .rail { display: flex; flex-direction: column; gap: 22px; padding: 26px 18px 22px; background: var(--lav-50); border-right: 1px solid var(--lav-200); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand-mark { position: relative; width: 34px; height: 34px; border-radius: 11px; background: var(--violet); }
  .brand-mark::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; border: 3px solid #fff; }
  .brand-mark::after { content: ''; position: absolute; left: 16px; top: 11px; width: 3px; height: 8px; border-radius: 2px; background: var(--mustard); transform-origin: bottom; transform: rotate(40deg); }
  .brand b { font-family: var(--font-display); font-size: 22px; color: var(--violet); }
  .rail-label { margin: 0 0 8px; padding: 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--slate); }
  .personas { display: grid; gap: 6px; }
  .persona { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 58px; padding: 8px 10px; border: 2px solid transparent; border-radius: 16px; background: transparent; text-align: left; cursor: pointer; }
  .persona:hover { background: var(--lav-100); }
  .persona[aria-pressed='true'] { background: #fff; border-color: var(--violet); box-shadow: 0 4px 14px rgb(43 33 96 / 0.10); }
  .avatar { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--lav-300); color: var(--violet); font-weight: 700; font-size: 13px; }
  .persona[aria-pressed='true'] .avatar { background: var(--violet); color: #fff; }
  .persona strong { display: block; font-size: 14.5px; line-height: 1.2; }
  .persona small { display: block; font-size: 12.5px; color: var(--slate); }
  .nav { display: grid; gap: 4px; }
  .nav button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; color: var(--violet); text-align: left; cursor: pointer; }
  .nav button:hover { background: var(--lav-100); }
  .nav button[aria-current='page'] { background: var(--violet); color: #fff; }
  .count { min-width: 24px; padding: 1px 8px; border-radius: 999px; background: var(--mustard); color: var(--mustard-ink); font-size: 12.5px; font-weight: 700; text-align: center; }
  .rail-foot { margin-top: auto; display: grid; gap: 10px; }
  .data-note { margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--mustard-50); color: var(--mustard-ink); font-size: 12.5px; }

  /* ---------- Main ---------- */
  main { position: relative; height: 900px; overflow: hidden; }
  .screen { height: 100%; padding: 28px 40px 28px; display: flex; flex-direction: column; gap: 18px; animation: enter 260ms ease-out both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--lav-500); }
  .top h1 { font-size: 34px; }
  .top p.sub { margin: 6px 0 0; max-width: 70ch; color: var(--slate); }
  .who-chip { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--lav-50); border: 1px solid var(--lav-200); white-space: nowrap; }
  .who-chip .avatar { width: 32px; height: 32px; }
  .who-chip span { font-size: 13.5px; color: var(--slate); }
  .who-chip b { color: var(--ink); }

  .card { padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 2px 12px rgb(43 33 96 / 0.05); }
  .card-lav { background: var(--lav-50); border-color: var(--lav-200); box-shadow: none; }
  .card h2 { font-size: 21px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .spacer { flex: 1; }
  .muted { color: var(--slate); }
  .small { font-size: 13.5px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border: 2px solid var(--violet); border-radius: 999px; background: var(--violet); color: #fff; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background 120ms, transform 120ms; }
  .btn:hover { background: var(--violet-2); }
  .btn:active { transform: scale(0.98); }
  .btn-lg { min-height: 56px; padding: 0 30px; font-size: 17px; }
  .btn-ghost { background: #fff; color: var(--violet); }
  .btn-ghost:hover { background: var(--lav-100); }
  .btn-mustard { background: var(--mustard); border-color: var(--mustard); color: var(--mustard-ink); }
  .btn-mustard:hover { background: #d9a92c; }
  .btn svg { width: 18px; height: 18px; }
  .link { padding: 6px 10px; border: 0; border-radius: 999px; background: none; color: var(--violet); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .link:hover { background: var(--lav-100); }

  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--lav-50); border: 1px solid var(--lav-200); align-self: flex-start; }
  .tabs button { min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: var(--violet); font-weight: 700; cursor: pointer; }
  .tabs button[aria-pressed='true'] { background: var(--violet); color: #fff; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 14px; }
  .stat { padding: 12px 18px; border-radius: 16px; background: var(--lav-50); border: 1px solid var(--lav-200); }
  .stat span { display: block; font-size: 13px; color: var(--slate); }
  .stat b { font-family: var(--font-display); font-size: 25px; color: var(--violet); }
  .stat-hl { background: var(--mustard-50); border-color: #ecd690; }
  .stat-hl b { color: var(--mustard-ink); }

  /* tables */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  thead th { font-size: 12.5px; font-weight: 700; color: var(--slate); letter-spacing: 0.02em; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  td small { display: block; color: var(--slate); font-size: 12.5px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.off td { color: var(--slate); background: #fbfafe; }
  tr.sel td { background: #fffaea; }
  tr.over td { background: var(--red-bg); }
  tr.over small { color: var(--red-ink); font-weight: 600; }
  .tnum { font-variant-numeric: tabular-nums; }

  .check { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; }
  .check:hover { background: var(--lav-100); }
  .check input { width: 22px; height: 22px; margin: 0; accent-color: var(--violet); cursor: pointer; }
  .check.disabled { cursor: not-allowed; }
  .check.disabled:hover { background: transparent; }
  .check input:disabled { cursor: not-allowed; }

  input[type='text'], textarea, select { width: 100%; min-height: 42px; padding: 8px 12px; border: 1.5px solid var(--lav-300); border-radius: 12px; background: #fff; color: var(--ink); }
  input[type='text']:focus, textarea:focus, select:focus { outline: 3px solid rgb(229 181 58 / 0.55); outline-offset: 1px; border-color: var(--violet); }
  input:disabled { background: var(--lav-50); border-color: var(--lav-200); }
  textarea { resize: none; }
  .field { display: grid; gap: 6px; font-weight: 700; font-size: 13.5px; color: var(--slate); }
  .field.invalid textarea, .field.invalid input { border-color: var(--red-ink); background: #fff8fa; }
  .err { display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--red-bg); color: var(--red-ink); font-weight: 700; animation: shake 360ms ease-out; }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
  .ok { display: flex; align-items: center; gap: 10px; margin: 0; padding: 12px 16px; border-radius: 14px; background: var(--green-bg); color: var(--green-ink); font-weight: 600; }

  .st { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .st-pending, .st-arrear { background: var(--mustard-50); color: #5e4204; }
  .st-approved, .st-regular { background: var(--green-bg); color: var(--green-ink); }
  .st-rejected, .st-reversal { background: var(--red-bg); color: var(--red-ink); }
  .st-withdrawn { background: var(--grey-bg); color: var(--grey-ink); }
  .st-day { background: var(--lav-100); color: var(--violet); }
  .st-holiday { background: var(--mustard-50); color: #5e4204; }

  .empty-box { display: grid; place-items: center; gap: 10px; padding: 46px 20px; text-align: center; color: var(--slate); }
  .empty-box .ring { width: 64px; height: 64px; border-radius: 50%; background: var(--lav-100); display: grid; place-items: center; color: var(--violet); }
  .empty-box .ring svg { width: 30px; height: 30px; }
  .empty-box h3 { font-size: 20px; }
  .empty-box p { margin: 0; max-width: 48ch; }

  /* ---------- Policy ---------- */
  .policy-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .rules { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .rule { padding: 16px; border-radius: 16px; background: #fff; border: 1px solid var(--lav-200); }
  .rule .ic { display: grid; place-items: center; width: 38px; height: 38px; margin-bottom: 10px; border-radius: 12px; background: var(--lav-100); color: var(--violet); }
  .rule .ic svg { width: 21px; height: 21px; }
  .rule dt { font-size: 13px; font-weight: 700; color: var(--lav-500); }
  .rule dd { margin: 4px 0 0; font-weight: 700; font-size: 15.5px; line-height: 1.3; }
  .chain { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; margin-top: 14px; }
  .link-step { position: relative; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--lav-200); margin-right: 22px; }
  .link-step:not(:last-child)::after { content: '→'; position: absolute; right: -19px; top: 50%; transform: translateY(-50%); color: var(--lav-500); font-weight: 700; }
  .link-step:last-child { margin-right: 0; background: var(--mustard-50); border-color: #ecd690; }
  .link-step span { display: block; font-size: 12.5px; color: var(--slate); }
  .link-step b { font-family: var(--font-display); font-size: 21px; color: var(--violet); }
  .link-step:last-child b { color: var(--mustard-ink); }
  .journey { display: flex; align-items: center; gap: 14px; }
  .journey .j { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; background: var(--lav-50); border: 1px solid var(--lav-200); }
  .journey .j b { display: block; font-size: 14px; }
  .journey .j small { display: block; font-size: 12.5px; color: var(--slate); }
  .journey .arrow { color: var(--lav-500); font-weight: 700; }

  /* ---------- Apply ---------- */
  .apply-grid { display: grid; grid-template-columns: 1fr 330px; gap: 18px; min-height: 0; }
  .meter-card { display: flex; flex-direction: column; gap: 14px; }
  .meter { position: relative; height: 16px; border-radius: 999px; background: var(--lav-100); overflow: hidden; display: flex; }
  .meter i { display: block; height: 100%; transition: width 320ms ease-out; }
  .meter .m-used { background: var(--violet); }
  .meter .m-sel { background: var(--mustard); }
  .meter .m-over { background: var(--red-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--slate); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .sel-total b { display: block; font-family: var(--font-display); font-size: 40px; color: var(--violet); line-height: 1; }
  .sel-total span { color: var(--slate); font-size: 13.5px; }
  .sel-total.over b { color: var(--red-ink); }
  td b, td small { white-space: nowrap; }
  table.compact td, table.compact th { padding-top: 3px; padding-bottom: 3px; }
  tr.over .muted { color: var(--red-ink); }
  .reason-in { min-height: 38px !important; padding: 6px 10px !important; }

  /* ---------- Review ---------- */
  .queue { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .qcard { display: grid; grid-template-columns: 220px 1fr 130px 380px; gap: 18px; align-items: center; padding: 16px 20px; }
  .qcard.leaving { animation: leave 300ms ease-in forwards; }
  @keyframes leave { to { opacity: 0; transform: translateX(30px); } }
  .qcard .who b { display: block; font-size: 16px; }
  .qcard .who small { display: block; color: var(--slate); font-size: 13px; }
  .qcard .why b { display: block; }
  .qcard .why small { display: block; color: var(--slate); font-size: 13px; }
  .qcard .hrs { text-align: right; }
  .qcard .hrs b { display: block; font-family: var(--font-display); font-size: 24px; color: var(--violet); line-height: 1.1; }
  .qcard .hrs small { color: var(--slate); font-size: 13.5px; font-weight: 600; }
  .decide { display: flex; gap: 8px; }
  .decide input { flex: 1; }
  .decide .btn { min-height: 42px; padding: 0 16px; }
  .next-bar { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: var(--radius); background: var(--lav-50); border: 1px solid var(--lav-200); }
  .next-bar p { margin: 0; color: var(--slate); }
  .next-bar p b { color: var(--ink); }

  /* toast */
  .toast { position: absolute; left: 50%; bottom: 26px; z-index: 30; max-width: 560px; margin: 0; padding: 13px 20px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  .toast.show { animation: toast 3200ms ease-out forwards; }
  .toast.bad { background: var(--red-ink); }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px); } 8%, 88% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }

  .hint { display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 12px 16px; border-radius: 14px; background: var(--mustard-50); color: var(--mustard-ink); }
  .hint svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
  .fin-bar { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 8px; }
  .fin-bar .field { width: 240px; }
  .reg-note { font-size: 12.5px; color: var(--red-ink); }
  tr.rev td { background: #fff8fa; }
  tr.arr td { background: #fffaea; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Overtime navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><b>Overtime</b></div>
    <div>
      <p class="rail-label">View as</p>
      <div class="personas" id="personas"></div>
    </div>
    <div>
      <p class="rail-label" id="nav-label">Asha's workspace</p>
      <nav class="nav" id="nav" aria-labelledby="nav-label"></nav>
    </div>
    <div class="rail-foot">
      <div class="nav"><button type="button" data-el="nav-policy" data-go="SCR-policy">Overtime policy</button></div>
      <p class="data-note">Fictional plant, people and pay. Nothing here is real data.</p>
    </div>
  </aside>

  <main id="main">
    <section class="screen" data-screen="SCR-policy" hidden></section>
    <section class="screen" data-screen="SCR-ot-apply" hidden></section>
    <section class="screen" data-screen="SCR-my-requests" hidden></section>
    <section class="screen" data-screen="SCR-review" hidden></section>
    <section class="screen" data-screen="SCR-team-apply" hidden></section>
    <section class="screen" data-screen="SCR-finalize" hidden></section>
    <section class="screen" data-screen="SCR-register" hidden></section>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </main>
</div>

<script>
(function () {
  'use strict';

  // ---------- Policy and rules (same logic as the portfolio demo) ----------
  var P = {
    name: 'Plant overtime policy',
    breakMin: { regular: 0, rest: 15, holiday: 15 },
    minMin: { regular: 30, rest: 60, holiday: 60 },
    block: 15,
    dailyCapMin: 240,
    monthlyCapMin: 1200,
    multiplier: { regular: 2, rest: 2, holiday: 3 }
  };
  var DAY_LABEL = { regular: 'Regular day', rest: 'Rest day', holiday: 'Holiday' };
  var MANAGER = 'Vikram Shah';
  var ME = 'E101';
  var CURRENT = '2026-10';

  var EMP = [
    { id: 'E101', key: 'asha', name: 'Asha Rao', dept: 'Paint shop', basic: 26000 },
    { id: 'E102', key: 'ravi', name: 'Ravi Kumar', dept: 'Paint shop', basic: 24000 },
    { id: 'E103', key: 'meena', name: 'Meena Iyer', dept: 'Welding', basic: 28000 },
    { id: 'E104', key: 'joseph', name: 'Joseph D’Souza', dept: 'Welding', basic: 22000 }
  ];
  var CLOCKED = [
    { empId: 'E101', date: '2026-10-03', dayType: 'regular', extraMin: 140 },
    { empId: 'E101', date: '2026-10-04', dayType: 'rest', extraMin: 320 },
    { empId: 'E101', date: '2026-10-08', dayType: 'regular', extraMin: 25 },
    { empId: 'E101', date: '2026-10-12', dayType: 'regular', extraMin: 95 },
    { empId: 'E101', date: '2026-10-15', dayType: 'regular', extraMin: 178 },
    { empId: 'E101', date: '2026-10-02', dayType: 'holiday', extraMin: 260 },
    { empId: 'E102', date: '2026-10-05', dayType: 'regular', extraMin: 200 },
    { empId: 'E102', date: '2026-10-11', dayType: 'rest', extraMin: 480 },
    { empId: 'E102', date: '2026-10-14', dayType: 'regular', extraMin: 130 },
    { empId: 'E103', date: '2026-10-06', dayType: 'regular', extraMin: 90 },
    { empId: 'E103', date: '2026-10-13', dayType: 'regular', extraMin: 150 },
    { empId: 'E104', date: '2026-10-07', dayType: 'regular', extraMin: 240 },
    { empId: 'E104', date: '2026-10-09', dayType: 'regular', extraMin: 240 },
    { empId: 'E104', date: '2026-10-10', dayType: 'rest', extraMin: 480 },
    { empId: 'E104', date: '2026-10-16', dayType: 'regular', extraMin: 240 },
    { empId: 'E104', date: '2026-10-17', dayType: 'rest', extraMin: 480 },
    { empId: 'E104', date: '2026-10-18', dayType: 'regular', extraMin: 240 },
    { empId: 'E103', date: '2026-09-27', dayType: 'rest', extraMin: 200 }
  ];
  var REVERSAL = { empId: 'E102', date: '2026-09-14', dayType: 'regular', minutes: -60, note: 'Hours corrected after September payout' };
  var SAMPLE_REMARKS = 'Covered the Line 2 backlog';

  function eligibleOt(dayType, extraMin) {
    var afterBreak = Math.max(0, extraMin - P.breakMin[dayType]);
    var belowMin = afterBreak < P.minMin[dayType];
    var rounded = belowMin ? 0 : Math.floor(afterBreak / P.block) * P.block;
    var eligible = Math.min(rounded, P.dailyCapMin);
    return { afterBreak: afterBreak, belowMin: belowMin, rounded: rounded, eligible: eligible, capped: rounded > P.dailyCapMin };
  }
  function hourlyRate(emp, dayType) { return (emp.basic / (26 * 8)) * P.multiplier[dayType]; }

  // ---------- Formatting ----------
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function hhmm(min) {
    var sign = min < 0 ? '−' : '';
    var m = Math.abs(Math.round(min));
    return sign + Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  }
  function rupees(n) {
    var r = Math.round(n);
    var s = String(Math.abs(r));
    // Indian grouping: last 3, then pairs.
    var last3 = s.slice(-3), rest = s.slice(0, -3);
    if (rest) rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',';
    return (r < 0 ? '−' : '') + '₹' + rest + last3;
  }

    if (act === 'start') { S.apply = { checked: [], reasons: {}, remarks: '', error: '' }; return go('SCR-ot-apply'); }
    if (act === 'submit') return submitApply();
    if (act === 'switch-manager') { S.flash = ''; S.mgrTab = 'review'; return go('SCR-review'); }
    if (act === 'withdraw') {
      var w = S.requests.find(function (r) { return r.id === Number(t.dataset.id); });
      if (w) w.status = 'withdrawn';
      S.flash = ''; S.myTab = 'history';
      toast('Withdrawn: ' + fmtDate(w.date) + ', ' + hhmm(w.minutes) + ' h. It’s in History.');
      return render();
    }
    if (act === 'approve' || act === 'reject') return decide(t, act);
    if (act === 'to-payroll') { S.finError = ''; return go('SCR-finalize'); }
    if (act === 'team-apply') return teamApply();
    if (act === 'consider' || act === 'ignore') return finalize(act);
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.matches('input[data-date]')) {
      var d = t.dataset.date, i = S.apply.checked.indexOf(d);
      if (t.checked && i < 0) S.apply.checked.push(d);
      if (!t.checked && i >= 0) S.apply.checked.splice(i, 1);
      S.apply.checked.sort();
      return refreshApplySelection();
    }
    if (t.matches('[data-act="team-all"]')) {
      document.querySelectorAll('input[data-team]:not(:disabled)').forEach(function (c) { c.checked = t.checked; });
      return refreshTeamNote();
    }
    if (t.matches('input[data-team]')) return refreshTeamNote();
    if (t.matches('[data-act="fin-all"]')) {
      document.querySelectorAll('input[data-fin]').forEach(function (c) { c.checked = t.checked; });
      return;
    }
    if (t.id === 'pay-month') { S.payMonth = t.value; S.finError = ''; return render(); }
    if (t.id === 'reg-month') { S.regMonth = t.value; return render(); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'remarks') S.apply.remarks = t.value;
    if (t.dataset && t.dataset.reason) S.apply.reasons[t.dataset.reason] = t.value;
  });

  function submitApply() {
    var a = S.apply;
    a.remarks = (document.getElementById('remarks') || { value: a.remarks }).value;
    var remarks = a.remarks.trim();
    a.error = ''; a.errorField = '';
    if (!a.checked.length) { a.error = 'Select at least one day.'; a.errorField = 'days'; return render(); }
    if (!remarks) { a.error = 'Remarks are required.'; a.errorField = 'remarks'; render(); var r = document.getElementById('remarks'); if (r) r.focus(); return; }
    var total = selectedMinutes();
    if (usedThisMonth(ME) + total > P.monthlyCapMin) { a.error = 'That’s over your monthly cap of ' + hhmm(P.monthlyCapMin) + ' h. Pick fewer days.'; a.errorField = 'days'; return render(); }
    S.batch += 1;
    a.checked.forEach(function (d) { addRequest(S, ME, d, { reason: (a.reasons[d] || '').trim() || remarks, remarks: remarks, batch: S.batch }); });
    S.flash = 'Sent ' + a.checked.length + ' day' + (a.checked.length > 1 ? 's' : '') + ', ' + hhmm(total) + ' h, to ' + MANAGER + '.';
    S.apply = { checked: [], reasons: {}, remarks: '', error: '' };
    S.myTab = 'pending';
    go('SCR-my-requests');
  }
  function decide(btn, act) {
    var r = S.requests.find(function (x) { return x.id === Number(btn.dataset.id); });
    var inp = document.querySelector('[data-remarks="' + r.id + '"]');
    r.status = act === 'approve' ? 'approved' : 'rejected';
    r.reviewerRemarks = inp && inp.value.trim() ? inp.value.trim() : undefined;
    var card = btn.closest('.qcard');
    toast((act === 'approve' ? 'Approved ' : 'Rejected ') + hhmm(r.minutes) + ' h for ' + emp(r.empId).name + ' (' + fmtDate(r.date) + '). Moved to Closed.');
    if (card) { card.classList.add('leaving'); setTimeout(render, 300); } else render();
  }
  function teamApply() {
    var picked = Array.prototype.slice.call(document.querySelectorAll('input[data-team]:checked'));
    if (!picked.length) { S.teamError = 'Select at least one row.'; return render(); }
    S.teamError = '';
    var mins = 0;
    picked.forEach(function (c) {
      var p = c.dataset.team.split('|');
      var r = addRequest(S, p[0], p[1], { reason: 'Applied by manager', remarks: '', by: 'manager', status: 'approved', batch: 0 });
      mins += r.minutes;
    });
    toast('Applied and approved ' + picked.length + ' day' + (picked.length > 1 ? 's' : '') + ', ' + hhmm(mins) + ' h, for your team.');
    S.mgrTab = 'review';
    go('SCR-review');
  }
  function finalize(act) {
    var ids = Array.prototype.slice.call(document.querySelectorAll('input[data-fin]:checked')).map(function (c) { return Number(c.dataset.fin); });
    if (!ids.length) { S.finError = 'Select at least one record.'; return render(); }
    S.finError = '';
    var as = act === 'consider' ? 'considered' : 'ignored';
    S.requests.forEach(function (r) { if (ids.indexOf(r.id) >= 0) r.final = { as: as, payMonth: as === 'considered' ? S.payMonth : undefined }; });
    if (as === 'considered') {
      S.regMonth = S.payMonth;
      toast(ids.length + ' record' + (ids.length > 1 ? 's' : '') + ' added to the ' + monthLabel(S.payMonth) + ' register.');
      return go('SCR-register');
    }
    toast(ids.length + ' record' + (ids.length > 1 ? 's' : '') + ' ignored. They won’t be paid.');
    render();
  }

  // Expose a tiny read-only hook for automated checks.
  window.__ot = { get state() { return S; }, get screen() { return current; } };
  onHash();
})();
</script>
</body>
</html>
