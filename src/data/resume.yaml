about:
  - >-
    I've been building products for over 10 years, and the part I enjoy most is the
    0-to-1 stretch: finding a real problem, shaping something people can use, and
    getting it out the door. I've done that in HR software, customer experience,
    procurement and supply chain, for small businesses and large enterprises.
  - >-
    These days most of my work is in AI. At o9 Solutions I led the UI for a no-code
    AI agent builder that teams used to ship 35+ agents in three months. At Zycus I
    led generative AI work that made invoice data extraction 15–20% more accurate.
  - >-
    I also like to build things myself: full-stack apps with Claude Code, agent
    workflows with MCP, and automations in n8n. I started out as a test engineer and
    then did an MBA in Information Systems, so I tend to think about quality and the
    business case at the same time.

